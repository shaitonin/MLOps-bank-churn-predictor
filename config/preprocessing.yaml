# preprocessing.yaml — Preprocessing and Feature Engineering Configuration
#
# Pipeline: data/processed/bank_churn.parquet
#        → data/features/bank_churn_features.parquet

# ── Output ─────────────────────────────────────────────────────────────────────
preprocessing:
  output_dir: "data/features"
  output_filename: "bank_churn_features.parquet"
  compression: "snappy"

# ── 1. Identifier Removal ──────────────────────────────────────────────────────
# Columns with no predictive value: sequential index, unique ID, and name.
drop_columns:
  - "RowNumber"
  - "CustomerId"
  - "Surname"
  - "Complain"     # potential leakage — see eda_report.md section 7

# ── 2. Binary Flags ────────────────────────────────────────────────────────────
# Capture binary patterns identified in the EDA:
#
# HasZeroBalance: 36.17% of customers have zero balance
# HighRiskProducts: customers with 3+ products have 82.7%–100% churn rate

binary_flags:
  - column: "Balance"
    value: 0
    operator: "=="
    new_column: "HasZeroBalance"
    inference_safe: true
  - column: "NumOfProducts"
    value: 3
    operator: ">="
    new_column: "HighRiskProducts"
    inference_safe: true

# ── 3. Interaction Features ────────────────────────────────────────────────────
# Derived features that capture combined signals identified in the EDA.
#
# AgeInactivity:
#   Amplifies the disengagement signal for older customers.
#   Formula: Age × (1 − IsActiveMember)
#   Type: product_complement — col_a × (1 − col_b)
#
# EngagementScore:
#   Composite customer engagement score (range: -1 to 3).
#   Formula: IsActiveMember + (NumOfProducts == 2) + HasCrCard − HasZeroBalance
#   Type: engagement_composite
#   ⚠ Requires HasZeroBalance created in the binary flags section (Section 2).
#   Required column order: [IsActiveMember, NumOfProducts, HasCrCard, HasZeroBalance]

interaction_features:
  - name: "AgeInactivity"
    type: "product_complement"
    col_a: "Age"
    col_b: "IsActiveMember"
  - name: "EngagementScore"
    type: "engagement_composite"
    columns: ["IsActiveMember", "NumOfProducts", "HasCrCard", "HasZeroBalance"]

# ── 4. Ratio Features ──────────────────────────────────────────────────────────
# BalanceSalaryRatio: ratio between account balance and estimated salary.
#   Formula: Balance / (EstimatedSalary + 1)
#   +1 in the denominator (denominator_offset) protects against division by zero.
ratio_features:
  - name: "BalanceSalaryRatio"
    numerator: "Balance"
    denominator: "EstimatedSalary"
    denominator_offset: 1

# ── 5. Age Groups ──────────────────────────────────────────────────────────────
# AgeGroup: discretizes age into groups to capture the non-linear relationship
#   between age and churn identified in the EDA.
#
# ordinal_encoding: true → converts labels to integers (0 to 4)
#   Tree-based models (XGBoost, RF) prefer ordinal encoding.
#   For linear regression: OHE can be applied in the modeling pipeline.
age_group:
  column: "Age"
  new_column: "AgeGroup"
  bins: [0, 30, 40, 50, 60, 100]
  labels: ["<30", "30-40", "40-50", "50-60", "60+"]
  ordinal_encoding: true
  ordinal_map:
    "<30":   0
    "30-40": 1
    "40-50": 2
    "50-60": 3
    "60+":   4

# ── 6. Categorical Encoding ────────────────────────────────────────────────────
# Geography   → One-Hot (3 categories with no natural order: France, Germany, Spain)
#
# Gender      → Binary encoding (Male=0, Female=1)
#
# Card Type   → dropped — no association with churn
#
# Methods:
#   "one_hot" → pd.get_dummies with prefix (drop_first=false keeps all categories)
#   "binary"  → manual 0/1 mapping via dictionary
categorical_encoding:
  - column: "Geography"
    method: "one_hot"
    prefix: "geo"
    drop_first: false
  - column: "Gender"
    method: "binary"
    mapping:
      "Male": 0
      "Female": 1
    new_column: "Gender_encoded"

# ── 7. Imputation (reference — apply inside modeling pipeline) ─────────────────
# ⚠ MLOps WARNING — Data Leakage:
#   Imputation is STATEFUL: it learns medians and modes exclusively from training
#   data. Fitting BEFORE the train/holdout split leaks test information into
#   training data → data leakage.
#
#   SOLUTION: GroupMedianImputer is applied INSIDE the modeling pipeline
#   (modeling.py), AFTER the train/holdout split.
#   This block is a CONFIGURATION REFERENCE; it is not executed during preprocessing.
#
# Strategies by column (EDA Section 8.3):
#   CreditScore     → median by Geography (score varies by geographic region)
#   Age             → global median (37; skewed distribution — median > mean)
#   Balance         → constant zero (36% of customers have zero balance — legitimate value)
#   EstimatedSalary → global median (100,194; uniform distribution)
#   NumOfProducts   → mode (1; most common value)
#   Tenure          → global median (5 years; uniform distribution)
#   Categoricals    → mode (most frequent value in each column)
imputation:
  - column: "CreditScore"
    strategy: "median_by_group"
    group_column: "Geography"
  - column: "Age"
    strategy: "median"
    fallback_value: 37
  - column: "Balance"
    strategy: "constant"
    fill_value: 0
  - column: "EstimatedSalary"
    strategy: "median"
    fallback_value: 100194
  - column: "NumOfProducts"
    strategy: "mode"
    fallback_value: 1
  - column: "Tenure"
    strategy: "median"
    fallback_value: 5
  - column: "Geography"
    strategy: "mode"
  - column: "Gender"
    strategy: "mode"
  - column: "Card Type"
    strategy: "mode"

# ── 8. Class Imbalance Handling (reference — configure in the model) ───────────
# ⚠ MLOps WARNING: These strategies are applied during model training.
#   They are NOT part of stateless preprocessing.
#
# EDA Section 8.2: retained:churned ratio = 7.962:2.038 ≈ 3.91:1
#
# scale_pos_weight: native XGBoost/LightGBM parameter — no computational cost
# smote: synthetic oversampling — generates artificial minority-class samples
# threshold_tuning: post-training adjustment — lowers threshold to maximize recall
#   for the churn class (false negative costs ~25× more than false positive)
class_imbalance:
  ratio: 3.91
  scale_pos_weight: 3.91           # for XGBoost/LightGBM
  smote:
    k_neighbors: 5
    random_state: 42
  threshold_tuning:
    default_threshold: 0.5
    recommended_threshold: 0.3    # maximizes churn class recall

# ── 9. Scaling (reference — apply inside modeling pipeline) ────────────────────
# ⚠ MLOps WARNING — Data Leakage:
#   Scaling is STATEFUL: it learns median/IQR and mean/std exclusively from
#   training data. Apply INSIDE the modeling pipeline, AFTER the split.
#   Never before — it would cause data leakage.
#
# Applied ONLY for Logistic Regression. Random Forest and XGBoost are
# scale-invariant (tree-based) — they do not require scaling.
#
# Strategies by column (EDA Section 8.1):
#   StandardScaler: zero mean, unit standard deviation
#     → CreditScore (near-normal, skew=-0.07)
#     → EstimatedSalary (uniform, no outliers)
#     → Point Earned (uniform, no outliers)
#     → Satisfaction Score (discrete 1-5)
#
#   RobustScaler: zero median, unit IQR (resistant to outliers and skewness)
#     → Age (skewed, skew=+1.01; valid elderly outliers)
#     → Balance (bimodal with 36% zeros)
#
#   log_transform_before_robust: np.log1p applied before RobustScaler
#     → Age: reduces positive skewness before scaling
#       (log1p compatible with zeros, if any)
#
#   Not scaled: binary, ordinal, and encodings — already in reduced scale
scaling:
  standard_columns:
    - "CreditScore"         # skew=-0.07 (near-normal) — StandardScaler appropriate
    - "EstimatedSalary"     # uniform, no outliers
    - "Point Earned"        # uniform, no outliers
    - "Satisfaction Score"  # discrete 1-5, no outliers
  robust_columns:
    - "Age"                 # skew=+1.01 (skewed), valid elderly outliers
    - "Balance"             # bimodal: 36% zeros + concentration ~100k
  log_transform_before_robust:
    - "Age"                 # log1p reduces right tail before RobustScaler
  not_scaled:
    # Binary — already on 0/1 scale
    - "HasCrCard"
    - "IsActiveMember"
    - "HasZeroBalance"
    - "HighRiskProducts"
    # Ordinal — reduced and interpretable scale
    - "AgeGroup"            # 0–4
    - "NumOfProducts"       # 1–4
    - "Tenure"              # 0–10
    # Derived features — scale depends on originals but does not distort tree models
    - "AgeInactivity"
    - "EngagementScore"
    - "BalanceSalaryRatio"
    # Encodings — already on 0/1 scale
    - "geo_France"
    - "geo_Germany"
    - "geo_Spain"
    - "Gender_encoded"

# ── 10. Feature Selection ──────────────────────────────────────────────────────
# Final subset for modeling — based on the EDA Report (Sections 8.1 and 8.8).
#
# Excluded: RowNumber, CustomerId, Surname (identifiers with no predictive value)
# Excluded: Geography, Gender, "Card Type" (replaced by encodings)
# Kept: Exited (target) to facilitate train/test split in modeling
#
# ⚠ Features with no significant linear association (EDA Section 8.8):
#   HasCrCard, EstimatedSalary, "Satisfaction Score", "Point Earned"
#   → Included: non-linear models (XGBoost, RF) may extract value via
#   interactions. Use SHAP values to confirm before excluding.
#
# ⚠ On Complain (EDA Section 7):
#   → Included but investigate data leakage before using in production.
#   → Train model WITHOUT Complain for comparison (see eda_report.md section 7).
feature_selection:
  target: "Exited"
  features_to_keep:
    # ── Original numeric ──
    - "CreditScore"
    - "Age"
    - "Tenure"
    - "Balance"
    - "NumOfProducts"
    - "HasCrCard"            # ⚠ no significant association (p=0.485) — verify with SHAP
    - "IsActiveMember"
    - "EstimatedSalary"      # ⚠ no significant association (p=0.211) — verify with SHAP
    - "Satisfaction Score"   # ⚠ no significant association (p=0.559) — verify with SHAP
    - "Point Earned"         # ⚠ no significant association (p=0.644) — verify with SHAP
    # ── Derived features — flags ──
    - "HasZeroBalance"
    - "HighRiskProducts"
    # ── Derived features — interactions ──
    - "AgeInactivity"
    - "EngagementScore"
    # ── Derived features — ratio ──
    - "BalanceSalaryRatio"
    # ── Derived features — age group ──
    - "AgeGroup"
    # ── Geography encoding ──
    - "geo_France"
    - "geo_Germany"
    - "geo_Spain"
    # ── Gender encoding ──
    - "Gender_encoded"
    # ── Target ──
    - "Exited"
