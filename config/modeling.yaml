# modeling.yaml — Experimentation and Modeling Configuration
#
# Pipeline: data/features/bank_churn_features.parquet
#        → mlruns/  (MLflow experiments)
#        → outputs/modeling/ (artifacts: plots, metrics)
#
# ── Preprocessing Pipeline (inside training — leak-free) ──────────────────────
#
# imputation: strategies per column (EDA Section 8.3).
#   Learns medians/modes EXCLUSIVELY from training data.
#   In production, the learned parameters are frozen inside the saved pipeline.
#
# scaling: APPLIED ONLY FOR LOGISTIC REGRESSION.
#   Random Forest and XGBoost are scale-invariant (tree-based).
#
#   standard_columns: StandardScaler (mean=0, std=1)
#     → normal or uniform distributions without extreme outliers
#   robust_columns: RobustScaler (median=0, IQR=1) + log1p on Age
#     → skewed and/or bimodal distributions resistant to outliers
#
# smote: synthetic oversampling to handle 3.91:1 class imbalance.
#   Applied AFTER split and imputation, BEFORE training — only on X_train.

pipeline:
  imputation:
    - column: "CreditScore"
      strategy: "median_by_group"
      group_by: "geo_France"          # Geography proxy after OHE
    - column: "Age"
      strategy: "median"
      fallback_value: 37
    - column: "Balance"
      strategy: "constant"
      fill_value: 0
    - column: "EstimatedSalary"
      strategy: "median"
      fallback_value: 100194
    - column: "NumOfProducts"
      strategy: "mode"
      fallback_value: 1
    - column: "Tenure"
      strategy: "median"
      fallback_value: 5

  scaling:
    # Only for Logistic Regression — ignored by RF and XGBoost
    standard_columns:
      - "CreditScore"
      - "EstimatedSalary"
      - "Point Earned"
      - "Satisfaction Score"
    robust_columns:
      - "Age"                         # skew=+1.01 — RobustScaler + log1p
      - "Balance"                     # bimodal with 36% zeros
    log_transform_before_robust:
      - "Age"                         # np.log1p before RobustScaler

  smote:
    enabled: true
    k_neighbors: 5
    random_state: 42


# ── Feature Reduction (via FeatureReducer — src/feature_reducer.py) ───────────
#
# Applied AFTER imputation and scaling, BEFORE the final estimator.
# Configured by method: none | rfe | pca | kpca
#
# Goal: empirically evaluate whether dimensionality reduction improves
# performance across the 3 models, comparing ROC-AUC with and without reduction.
#
# method: default method used in baseline (and in models without Optuna).
#   "none" → no reduction (baseline); Optuna overrides via search_space.method.
#
# search_space.method: methods Optuna can explore per trial.
#   Optuna co-optimizes: reduction method + method parameters + estimator.
#

feature_reduction:
  method: "none"                      # default for baseline; Optuna overrides

  search_space:
    method:
      type: "categorical"
      choices: ["none", "rfe", "pca", "kpca"]

  # ── RFE — Recursive Feature Elimination ──────────────────────────────────────
  rfe:
    n_features_to_select: 15
    rfe_estimator: "random_forest"
    search_space:
      n_features_to_select:
        type: "int"
        low: 8
        high: 16

  # ── PCA — Principal Component Analysis ───────────────────────────────────────
  # Transforms the 21 features into orthogonal components ordered by variance.
  # Requires prior scaling (already configured in pipeline.scaling).
  # Empirically evaluated to check whether multicollinearity among derived
  # features (e.g. AgeInactivity and Age) negatively impacts models.
  # n_components: between 8 and 18 (minimum to capture ~80% of variance).
  pca:
    n_components: 15
    search_space:
      n_components:
        type: "int"
        low: 8
        high: 18

  # ── KPCA — Kernel PCA ─────────────────────────────────────────────────────────
  # Non-linear version of PCA via implicit mapping to a high-dimensional space.
  # kernel=rbf: suitable for non-linear relationships (recommended default).
  # Computationally more expensive than PCA — O(n²) in memory.
  # gamma: null → 1/n_features (sklearn default = 1/21 ≈ 0.048).
  kpca:
    n_components: 12
    kernel: "rbf"
    gamma: null                       # null → 1/n_features (sklearn default)
    degree: 3                         # used only for kernel=poly
    coef0: 1.0                        # used only for kernel=poly and sigmoid
    search_space:
      n_components:
        type: "int"
        low: 8
        high: 18
      kernel:
        type: "categorical"
        choices: ["rbf", "poly", "cosine"]
      gamma:
        type: "log_float"
        low: 1.0e-4
        high: 10.0
      degree:
        type: "int"
        low: 2
        high: 5
      coef0:
        type: "float"
        low: 0.0
        high: 1.0

# ── General Experiment Configuration ──────────────────────────────────────────
modeling:
  experiment_name: "bank-churn-classification"
  tracking_uri: "sqlite:///mlflow.db"   # local database — mlflow.db created at project root
  random_seed: 42

# ── Train / Holdout Split ──────────────────────────────────────────────────────
# stratify=true ensures 80/20 class proportion in train and test sets.
holdout:
  test_size: 0.20
  stratify: true                      # essential for imbalanced classes (3.91:1)

# ── Cross-Validation ───────────────────────────────────────────────────────────
# StratifiedKFold is mandatory for imbalanced classification:
# ensures each fold maintains the original 80% retained / 20% churn proportion.
# Plain KFold could generate folds with no churn class examples.
cv:
  strategy: "stratified_kfold"        # stratified_kfold required for imbalanced data
  n_splits: 5
  shuffle: true

# ── Optuna ────────────────────────────────────────────────────────────────────
# default_trials: number of trials used for ALL models.
# To override per model, add optuna_trials: N to the model entry.
optuna:
  default_trials: 30

# ── Threshold Tuning ───────────────────────────────────────────────────────────
# Applied post-training on probabilities (predict_proba).
# Lowers the threshold from 0.50 to 0.40 to maximize churn class recall.
threshold_tuning:
  default_threshold: 0.50
  optimized_threshold: 0.40
  optimize_for: "recall"              # metric the threshold optimizes

# ── Metrics ───────────────────────────────────────────────────────────────────
# primary: used to select the best model and guide Optuna.
# Accuracy is not an appropriate metric for imbalanced data (EDA Section 8.5):
# a trivial model (always predicts "stays") achieves 79.62% with no real predictive power.
metrics:
  primary: "roc_auc"                  # roc_auc | f1 | recall
  additional:
    - "f1"                            # balance of precision/recall for the churn class
    - "recall"                        # minimizes false negatives (lost customers)
    - "precision"                     # avoids excess false positives
    - "average_precision"             # PR-AUC — better than ROC-AUC under imbalance


# ── Models ────────────────────────────────────────────────────────────────────
# Each entry defines:
#   enabled        : activates/deactivates the model without removing the config
#   module/class   : dynamic import (importlib) — no hardcoding in the code
#   default_params : parameters used in baseline and as Optuna starting point
#   search_space   : Optuna search space per parameter
#
# Supported types in search_space:
#   log_float  → suggest_float(low, high, log=True)   — C, learning_rate, alpha
#   float      → suggest_float(low, high)              — subsample, fractions
#   int        → suggest_int(low, high)                — n_estimators, depth
#   categorical→ suggest_categorical(choices)          — solver, penalty, etc.

models:

  # ── Logistic Regression (linear baseline) ────────────────────────────────────
  # Interpretable reference model — useful for understanding linear feature
  # importance and as a minimum comparison baseline.
  # class_weight='balanced': adjusts weights inversely proportional to class
  #   frequency — alternative to SMOTE for imbalance handling.
  # Requires StandardScaler (CreditScore, EstimatedSalary, Point Earned, Satisfaction Score)
  #   and RobustScaler + log1p (Age, Balance) — configured in pipeline.scaling.
  # C: inverse of L2 regularization (high C = less regularization = more flexible).
  # solver=lbfgs: efficient for small/medium datasets with L2 regularization.
  logistic_regression:
    enabled: true
    module: "sklearn.linear_model"
    class: "LogisticRegression"
    default_params:
      C: 1.0
      penalty: "l2"
      solver: "lbfgs"
      class_weight: "balanced"
      max_iter: 1000
      random_state: 42
    search_space:
      C:
        type: "log_float"
        low: 1.0e-3
        high: 100.0
      penalty:
        type: "categorical"
        choices: ["l2", "l1"]         # l1 requires solver=liblinear or saga
      solver:
        type: "categorical"
        choices: ["lbfgs", "liblinear", "saga"]

  # ── Random Forest ─────────────────────────────────────────────────────────────
  # Ensemble of independent trees (bagging) — comparison model.
  # Already tested in the Scikit-Learn project: accuracy 0.86, F1 churn 0.51 (no SMOTE).
  # class_weight='balanced': alternative to scale_pos_weight for RF in sklearn.
  # max_features='sqrt': classification default — reduces correlation between trees.
  # Does not require scaling — scale-invariant.
  random_forest:
    enabled: true
    module: "sklearn.ensemble"
    class: "RandomForestClassifier"
    default_params:
      n_estimators: 200
      max_depth: 10
      class_weight: "balanced"
      random_state: 42
      n_jobs: -1
    search_space:
      n_estimators:
        type: "int"
        low: 100
        high: 500
      max_depth:
        type: "int"
        low: 5
        high: 20
      min_samples_split:
        type: "int"
        low: 2
        high: 20
      min_samples_leaf:
        type: "int"
        low: 1
        high: 20
      max_features:
        type: "categorical"
        choices: ["sqrt", "log2"]

  # ── XGBoost ───────────────────────────────────────────────────────────────────
  # Optimized gradient boosting — main model of this project (EDA Section 8.4).
  # scale_pos_weight=3.91: handles imbalance natively by weighting churn class
  #   errors. Derived from the retained:churned ratio observed in EDA.
  # use_label_encoder=False and eval_metric='logloss': avoid XGBoost 1.6+ warnings.
  # reg_alpha (L1): induces sparsity — can zero out irrelevant features.
  # colsample_bytree: fraction of features per tree — reduces inter-tree correlation.
  # subsample: fraction of samples per tree — regularization via sampling.
  # Does not require scaling — scale-invariant.
  xgboost:
    enabled: true
    module: "xgboost"
    class: "XGBClassifier"
    default_params:
      n_estimators: 300
      max_depth: 5
      learning_rate: 0.05
      scale_pos_weight: 3.91          # retained:churned ratio (EDA Section 8.2)
      subsample: 0.8
      colsample_bytree: 0.8
      use_label_encoder: false
      eval_metric: "logloss"
      random_state: 42
      verbosity: 0
      n_jobs: -1
    search_space:
      n_estimators:
        type: "int"
        low: 100
        high: 600
      max_depth:
        type: "int"
        low: 3
        high: 10
      learning_rate:
        type: "log_float"
        low: 0.01
        high: 0.3
      subsample:
        type: "float"
        low: 0.5
        high: 1.0
      colsample_bytree:
        type: "float"
        low: 0.4
        high: 1.0
      reg_alpha:
        type: "log_float"
        low: 1.0e-5
        high: 10.0
      reg_lambda:
        type: "log_float"
        low: 1.0e-5
        high: 10.0
      scale_pos_weight:
        type: "float"
        low: 1.0
        high: 6.0                     # range around 3.91

  # ── LightGBM ──────────────────────────────────────────────────────────────────
  # Leaf-wise gradient boosting — direct comparison with XGBoost (depth-wise).
  # Leaf-wise growth tends to converge faster and produce more asymmetric trees,
  # which may better capture rare patterns (e.g. churn).
  # is_unbalance=true: LightGBM native imbalance handling —
  #   do not use simultaneously with scale_pos_weight.
  # num_leaves: main complexity parameter — replaces max_depth.
  #   Controls the maximum number of leaves per tree.
  #   Rule of thumb: num_leaves < 2^max_depth to avoid overfitting.
  # min_child_samples: minimum samples per leaf — important regularization
  #   when is_unbalance=true (leaves with few positives tend to overfit).
  # Does not require scaling — scale-invariant.
  lightgbm:
    enabled: true
    module: "lightgbm"
    class: "LGBMClassifier"
    default_params:
      n_estimators: 300
      num_leaves: 31                    # main complexity parameter
      max_depth: -1                     # -1 = no limit (num_leaves controls)
      learning_rate: 0.05
      is_unbalance: true                # handles 3.91:1 imbalance natively
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_samples: 20
      random_state: 42
      verbosity: -1                     # suppresses LightGBM logs
      n_jobs: -1
    search_space:
      n_estimators:
        type: "int"
        low: 100
        high: 600
      num_leaves:
        type: "int"
        low: 20
        high: 100                       # >100 increases overfitting risk
      learning_rate:
        type: "log_float"
        low: 0.01
        high: 0.3
      subsample:
        type: "float"
        low: 0.5
        high: 1.0
      colsample_bytree:
        type: "float"
        low: 0.4
        high: 1.0
      min_child_samples:
        type: "int"
        low: 10
        high: 100
      reg_alpha:
        type: "log_float"
        low: 1.0e-5
        high: 10.0
      reg_lambda:
        type: "log_float"
        low: 1.0e-5
        high: 10.0

# ── Artifacts ─────────────────────────────────────────────────────────────────
# All plots are saved to output_dir and logged to MLflow as artifacts.
artifacts:
  output_dir: "outputs/modeling"
  save_plots: true
  plots:
    - "roc_curve"                     # ROC curve with AUC per model
    - "precision_recall_curve"        # PR-AUC — better than ROC under imbalance
    - "confusion_matrix"              # confusion matrix with optimized threshold
    - "threshold_analysis"            # recall/precision vs threshold (justifies 0.40)
    - "feature_importance"            # top 20 features per model
    - "shap_summary"                  # SHAP values — validates EDA feature selection
    - "cv_fold_comparison"            # ROC-AUC per fold (CV robustness)
    - "learning_curve"                # bias-variance (training size vs metric)
    - "optuna_optimization_history"   # objective evolution per trial
    - "optuna_param_importances"      # hyperparameter importances in Optuna
    - "class_distribution"            # distribution before/after SMOTE
