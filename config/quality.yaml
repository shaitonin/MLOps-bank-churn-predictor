# quality.yaml — Data Quality Configuration via Great Expectations
#
# This file defines ALL quality rules. The code (src/quality_checks.py)
# is generic: it reads this YAML and executes the checks dynamically.
#
# Expectation types use snake_case (GE standard).
# kwargs follow the exact signature of each GE class.
#
# All numeric parameters were derived from the real dataset (EDA Section 9)
# using robust percentiles (p01–p99) + statistical tolerances (±2σ).

quality:
  suite_name: "bank_churn_suite"
  # fail_pipeline_on_error: true → raises RuntimeError if any check fails
  # Use true in production, false during exploration / development
  fail_pipeline_on_error: false
  output_dir: "outputs/quality"

# ─────────────────────────────────────────────────────────────────────────────
# TABLE Expectations
# Validate global dataset properties
# ─────────────────────────────────────────────────────────────────────────────
table_expectations:

  # Observed dataset: 10,000 rows
  # Tolerance ±20%: minimum 8,000, maximum 12,000
  - type: expect_table_row_count_to_be_between
    kwargs:
      min_value: 8000
      max_value: 12000

  # Ensures the schema has not changed — no columns added or removed
  - type: expect_table_columns_to_match_set
    kwargs:
      column_set:
        - "RowNumber"
        - "CustomerId"
        - "Surname"
        - "CreditScore"
        - "Geography"
        - "Gender"
        - "Age"
        - "Tenure"
        - "Balance"
        - "NumOfProducts"
        - "HasCrCard"
        - "IsActiveMember"
        - "EstimatedSalary"
        - "Exited"
        - "Complain"
        - "Satisfaction Score"
        - "Card Type"
        - "Point Earned"
      exact_match: true

# ─────────────────────────────────────────────────────────────────────────────
# COLUMN Expectations
# ─────────────────────────────────────────────────────────────────────────────
column_expectations:

  # ── Target variable ────────────────────────────────────────────────────────
  # Observed distribution: 79.62% retained (0), 20.38% churned (1)
  Exited:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_in_set
      kwargs:
        value_set: [0, 1]

  # ── Continuous numeric features ────────────────────────────────────────────

  # Observed data: min=350, max=850, mean=650.5, std=96.7, skew=-0.07
  CreditScore:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_between
      kwargs:
        min_value: 432      # p01 observed
        max_value: 850      # p99 observed (historical score maximum)
        mostly: 0.99
    - type: expect_column_mean_to_be_between
      kwargs:
        min_value: 457.2    # mean - 2σ = 650.5 - 2×96.7
        max_value: 843.8    # mean + 2σ = 650.5 + 2×96.7
    - type: expect_column_stdev_to_be_between
      kwargs:
        min_value: 48.3     # std × 0.5
        max_value: 145.0    # std × 1.5

  # Observed data: min=18, max=92, mean=38.9, std=10.5, skew=+1.01 (skewed)
  Age:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_between
      kwargs:
        min_value: 21       # p01 observed (realistic legal minimum = 18)
        max_value: 72       # p99 observed (long tail up to 92, but rare)
        mostly: 0.99
    - type: expect_column_mean_to_be_between
      kwargs:
        min_value: 17.9     # mean - 2σ = 38.9 - 2×10.5
        max_value: 59.9     # mean + 2σ = 38.9 + 2×10.5
    - type: expect_column_stdev_to_be_between
      kwargs:
        min_value: 5.2      # std × 0.5 = 10.5 × 0.5
        max_value: 15.7     # std × 1.5 = 10.5 × 1.5

  # Observed data: min=0, max=250,898, median=97,199
  # NOTE: 36.17% of customers have balance = 0 — legitimate behavior, not an error
  Balance:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_between
      kwargs:
        min_value: 0        # zero is a legitimate and frequent value
        max_value: 250898   # historical maximum observed
    - type: expect_column_mean_to_be_between
      kwargs:
        min_value: 0        # mean can be low (bimodal distribution)
        max_value: 201281   # mean + 2σ = 76,486 + 2×62,397

  # Observed data: min=11.58, max=199,992, uniform
  EstimatedSalary:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_between
      kwargs:
        min_value: 0        # cannot be negative
        max_value: 200000   # observed limit (~200k)
        mostly: 0.99
    - type: expect_column_mean_to_be_between
      kwargs:
        min_value: 0        # uniform distribution — mean can vary
        max_value: 215111   # mean + 2σ = 100,090 + 2×57,510

  # Observed data: min=119, max=1,000, uniform
  Point Earned:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_between
      kwargs:
        min_value: 119      # historical minimum of the points program
        max_value: 1000     # maximum of the points program
    - type: expect_column_mean_to_be_between
      kwargs:
        min_value: 154.7    # mean - 2σ = 606.5 - 2×225.9
        max_value: 1058.4   # mean + 2σ (cap at 1000 in practice)

  # ── Discrete numeric features ───────────────────────────────────────────────

  # Observed data: min=0, max=10, mean=5.01, uniform
  Tenure:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_between
      kwargs:
        min_value: 0        # new customer
        max_value: 10       # historical maximum = 10 years

  # Observed data: min=1, max=4, median=1
  # NOTE: non-linear relationship with churn — 3-4 products = very high churn
  NumOfProducts:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_between
      kwargs:
        min_value: 1        # minimum: at least 1 product subscribed
        max_value: 4        # historical maximum observed

  # Fixed satisfaction scale: 1 (very poor) to 5 (excellent)
  Satisfaction Score:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_between
      kwargs:
        min_value: 1
        max_value: 5
    - type: expect_column_values_to_be_in_set
      kwargs:
        value_set: [1, 2, 3, 4, 5]

  # ── Binary variables ───────────────────────────────────────────────────────
  HasCrCard:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_in_set
      kwargs:
        value_set: [0, 1]

  IsActiveMember:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_in_set
      kwargs:
        value_set: [0, 1]

  # Pearson correlation with Exited = 0.9957 — investigate data leakage (EDA Section 7)
  Complain:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_in_set
      kwargs:
        value_set: [0, 1]

  # ── Categorical variables ──────────────────────────────────────────────────

  # Observed distribution: France=50.1%, Germany=25.1%, Spain=24.8%
  # Germany has 2× higher churn — deviation from this distribution warrants attention
  Geography:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_in_set
      kwargs:
        value_set: ["France", "Germany", "Spain"]

  # Observed distribution: Male=54.57%, Female=45.43%
  Gender:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_in_set
      kwargs:
        value_set: ["Male", "Female"]

  # Perfectly balanced distribution (~25% per category)
  # Any large deviation would indicate a collection or encoding issue
  Card Type:
    - type: expect_column_values_to_not_be_null
    - type: expect_column_values_to_be_in_set
      kwargs:
        value_set: ["DIAMOND", "GOLD", "SILVER", "PLATINUM"]
