# pipeline.yaml

pipeline:
  name: "bank-churn-data-pipeline"
  version: "1.0.0"
  description: "Ingestion pipeline for bank customer churn data (Bank Churn - Kaggle)."

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  output_filename: "bank_churn.parquet" 

logging:
  level: "INFO"     # DEBUG | INFO | WARNING | ERROR
  format: "%(asctime)s [%(levelname)s] %(name)s - %(message)s" 
  datefmt: "%Y-%m-%d %H:%M:%S" 
  log_to_file: false 
  log_file: "pipeline.log" 

execution:
  skip_download_if_exists: true
  skip_ingest_if_exists: true
  force_redownload: false
  force_ingest: false

  